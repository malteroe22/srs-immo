<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRS Immobilien</title>
  <style>
    body {
      margin: 0;
      background-color: #1f1f1f; /* edler dunkler Grauton */
      color: #ffffff;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    img {
      max-width: 300px;
      height: auto;
      margin-bottom: 15px; /* weniger Abstand  */
    }

    h1 {
      font-size: 1.5em; /* Schriftgröße reduziert */
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #dddddd;
      margin-bottom: 80px; /* Abstand zu den Buttons bleibt */
    }

    .button-container {
      display: flex;
      gap: 20px; /* Abstand zwischen den Buttons */
      margin-bottom: 10px;
      flex-wrap: wrap; /* falls kleine Bildschirme */
      justify-content: center;
    }

    .contact-button {
      padding: 12px 30px;
      background-color: #3a3a3a; /* eleganter Grauton */
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Georgia', serif; /* gleiche Schrift */
      font-weight: normal; /* keine Fettschrift */
      transition: all 0.3s ease;
    }

    .contact-button:hover {
      background-color: #555555;
      border-color: #777;
    }

    .contact-info {
      margin-top: 10px;
      display: none;
      font-size: 16px;
      color: #ffffff; /* Text standardmäßig weiß */
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      font-family: 'Georgia', serif;
    }

    .contact-info.show {
      display: block;
      opacity: 1;
    }

    .contact-info a {
      color: #ffffff; /* E-Mail-Link in weiß */
      text-decoration: none;
    }
  </style>
</head>
<body>
  <img src="logo-srs-immobilien.png" alt="SRS Immobilien Logo" />
  <h1>Kontaktieren Sie uns!</h1>

  <!-- Click-to-Reveal Buttons -->
  <div class="button-container">
    <button class="contact-button" onclick="revealEmail()">E-Mail</button>
    <button class="contact-button" onclick="revealPhone()">Telefon</button>
  </div>

  <div id="email" class="contact-info"></div>
  <div id="phone" class="contact-info"></div>

  <script>
    function revealEmail() {
      const user = "info";
      const domain = "srs.immo";
      const email = user + "@" + domain;
      const emailDiv = document.getElementById("email");
      emailDiv.innerHTML = '<a href="mailto:' + email + '">' + email + '</a>';
      emailDiv.classList.add("show");
    }

    function revealPhone() {
      const phone = "07156 - 42 60 88";
      const phoneDiv = document.getElementById("phone");
      phoneDiv.innerText = phone;
      phoneDiv.classList.add("show");
    }
  </script>
</body>
</html>
