<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRS Immobilien</title>

  <style>
    @font-face {
      font-family: 'Big Caslon';
      src: url('BigCaslon.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      background-color: #1f1f1f;
      color: #ffffff;
      font-family: 'Big Caslon', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    img {
      max-width: 300px;
      height: auto;
      margin-bottom: 15px; 
    }

    h1 {
      font-size: 1.2em;
      letter-spacing: 1px;
      color: #dddddd;
      margin-bottom: 25px;
      font-family: 'Big Caslon', serif;
    }

    .button-container {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .contact-button {
      padding: 12px 30px;
      background-color: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Big Caslon', serif;
      transition: all 0.3s ease;
    }

    .contact-button:hover {
      background-color: #555555;
      border-color: #777;
    }

    .contact-info {
      margin-top: 10px;
      display: none;
      font-size: 16px;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      font-family: 'Big Caslon', serif;
    }

    .contact-info.show {
      display: block;
      opacity: 1;
    }

    .contact-info a {
      color: #ffffff;
      text-decoration: none;
    }

    /* Impressum Button Position kleiner und dezenter */
    .impressum-container {
      position: absolute;
      bottom: 20px;
      font-size: 14px;
    }

    .impressum-button {
      color: #aaaaaa;
      text-decoration: none;
      font-family: 'Big Caslon', serif;
    }

    .impressum-button:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <img src="logo-srs-immobilien.png" alt="SRS Immobilien Logo" />
  <h1>
  Möchten Sie Ihre renovierungsbedürftige Immobilie verkaufen?
  <br><br>
  Kontaktieren Sie uns!
  </h1>

  <div class="button-container">
    <button class="contact-button" onclick="revealEmail()">E-Mail</button>
    <button class="contact-button" onclick="revealPhone()">Telefon</button>
  </div>

  <div id="email" class="contact-info"></div>
  <div id="phone" class="contact-info"></div>

  <div class="impressum-container">
    <a class="impressum-button" href="impressum.html">Impressum</a>
  </div>

  <script>
    function revealEmail() {
      const user = "info";
      const domain = "srs.immo";
      const email = user + "@" + domain;
      const emailDiv = document.getElementById("email");
      emailDiv.innerHTML = '<a href="mailto:' + email + '">' + email + '</a>';
      emailDiv.classList.add("show");
    }

    function revealPhone() {
      const phone = "07156 426088";
      const phoneDiv = document.getElementById("phone");
      phoneDiv.innerText = phone;
      phoneDiv.classList.add("show");
    }
  </script>
</body>
</html>
